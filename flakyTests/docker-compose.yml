version: '3.8'

services:
  # Jenkins for comparison
  jenkins:
    # Security: Pinned to specific LTS version instead of floating :lts tag
    image: jenkins/jenkins:2.479.4-lts
    container_name: jenkins-flaky-demo
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      # Security Warning: Mounting docker.sock grants root-level access to host Docker daemon.
      # Only use in trusted environments. Consider alternatives like Docker-in-Docker or rootless mode.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    networks:
      - demo-network

  # If you want to run TeamCity locally instead of using Cloud
  teamcity-server:
    # Security: Pinned to specific version instead of :latest tag
    image: jetbrains/teamcity-server:2024.12.4
    container_name: teamcity-server-demo
    ports:
      - "8111:8111"
    volumes:
      - teamcity_data:/data/teamcity_server/datadir
      - teamcity_logs:/opt/teamcity/logs
    networks:
      - demo-network

  teamcity-agent:
    # Security: Pinned to specific version instead of :latest tag
    image: jetbrains/teamcity-agent:2024.12.4
    container_name: teamcity-agent-demo
    environment:
      - SERVER_URL=http://teamcity-server:8111
      - AGENT_NAME=LocalAgent
    volumes:
      - agent_config:/data/teamcity_agent/conf
      # Security Warning: Mounting docker.sock grants root-level access to host Docker daemon.
      # Only use in trusted environments. Consider alternatives like Docker-in-Docker or rootless mode.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - demo-network
    depends_on:
      - teamcity-server

volumes:
  jenkins_data:
  teamcity_data:
  teamcity_logs:
  agent_config:

networks:
  demo-network:
    driver: bridge

# Quick Start Commands:
# 
# 1. Start everything:
#    docker-compose up -d
#
# 2. Get Jenkins initial password:
#    docker-compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#
# 3. Access:
#    - Jenkins: http://localhost:8080
#    - TeamCity: http://localhost:8111
#
# 4. Stop everything:
#    docker-compose down
#
# 5. Clean up everything:
#    docker-compose down -v
